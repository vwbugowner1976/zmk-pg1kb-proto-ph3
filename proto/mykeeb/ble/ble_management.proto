syntax = "proto3";

package mykeeb.ble;

message GetStatusRequest {}
message SelectProfileRequest { uint32 index = 1; }
message ClearProfileRequest { uint32 index = 1; }
message DisconnectProfileRequest { uint32 index = 1; }
message ClearAllRequest {}

message Request {
    oneof request_type {
        GetStatusRequest get_status = 1;
        SelectProfileRequest select_profile = 2;
        ClearProfileRequest clear_profile = 3;
        DisconnectProfileRequest disconnect_profile = 4;
        ClearAllRequest clear_all = 5;
    }
}

message StatusResponse {
    uint32 active_profile = 1;
    uint32 profile_count = 2;
    uint32 bonded_mask = 3;
    uint32 connected_mask = 4;
    uint32 open_mask = 5;
}

message CommandResponse {
    int32 status = 1;
    StatusResponse state = 2;
}

message ErrorResponse { int32 status = 1; }

message Response {
    oneof response_type {
        StatusResponse status = 1;
        CommandResponse command = 2;
        ErrorResponse error = 3;
    }
}
