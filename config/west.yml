manifest:
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: sekigon-gonnoc
      url-base: https://github.com/sekigon-gonnoc
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: mjmjm0101
      url-base: https://github.com/mjmjm0101
    # non-lipo モジュールの ZMK_SLEEP 強制解除を待つ間だけ使う fork。
    - name: snize
      url-base: https://github.com/snize
    - name: vwbugowner1976
      url-base: https://github.com/vwbugowner1976

  projects:
    # DYA Studio Custom Studio Protocol 対応版。
    - name: zmk
      remote: cormoran
      revision: main+dya
      import:
        file: app/west.yml

    # DYA fork が使用する Zephyr。zmk の import よりこちらを優先する。
    - name: zephyr
      remote: cormoran
      revision: v4.1.0+zmk-fixes+nrf-half-duplex-uart
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m

    # DYA Studio core / settings.
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    - name: zmk-feature-fast-keymap
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main

    # PAW3222 DYA対応版は通常版 main と分離する。
    - name: zmk-driver-paw3222
      remote: vwbugowner1976
      revision: dya-studio

    # 既存ハードウェア機能。
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: zmk-0.3
    - name: zmk-feature-non-lipo-battery-management
      remote: snize
      revision: fix/do-not-force-zmk-sleep
    - name: zmk-input-processor-scroll-inertia
      remote: mjmjm0101
      revision: main

  self:
    path: config
