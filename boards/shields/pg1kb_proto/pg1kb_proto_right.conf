CONFIG_BT_PERIPHERAL_PREF_MIN_INT=8
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=10
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_MAX_MV=1500
CONFIG_ZMK_NON_LIPO_LOW_MV=1000
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=0

# 左手側（peripheral）の電池残量も取得してホストへ報告する
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# スムーススクロール（HID Resolution Multiplier）。
# HID レポートを送るのは central 側だけなので、この設定も右手側にのみ書く。
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# scroll-inertia は central の既定 input thread stack 512B では不足する。
# PG1KB実機でハードフリーズを再現し、2048Bで解消したため恒久設定。
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Deep Sleep（1時間の無操作で電源断）。左右は独立して眠るので両方に書く。
# non-lipo モジュールが ZMK_SLEEP を強制しなくなったため、明示的に有効化している。
# 眠らせたくないときはこの2行をコメントアウトする。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# PAW3222のポーリング間隔
CONFIG_PAW3222_REPORT_INTERVAL_MS=15

# Prospector Scanner status advertisement
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="PG1KB"

# My Keeb Studio / runtime pointing configuration
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# Runtime Combo.  Same ZMK 0.3 compatible stack used by LoTom.
# Runtime combo settings live on the right/central half, which owns Studio RPC.
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Right/Sym scroll inertia runtime controls exposed under cormoran_rip.
CONFIG_PG1KB_INERTIA_RUNTIME_SETTINGS=y

# MyKeebStudio BLE profile status/select/clear/disconnect RPC.
# Central/right side only. Commands are secured by Studio Unlock.
CONFIG_PG1KB_BLE_MANAGEMENT_STUDIO_RPC=y
