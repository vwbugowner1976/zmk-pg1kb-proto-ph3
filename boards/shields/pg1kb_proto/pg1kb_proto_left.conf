# 単4アルカリ乾電池の残量測定（右手側と同じ設定。BAT_CHECK は AIN3 / P0.05）
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_MAX_MV=1500
CONFIG_ZMK_NON_LIPO_LOW_MV=1000
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=0

# PMW3610 を選んだ場合のみ有効な設定 (uncomment and edit as needed)
# CONFIG_PMW3610_REPORT_INTERVAL_MIN=12

# Deep Sleep（1時間の無操作で電源断）。左右は独立して眠るので両方に書く。
# non-lipo モジュールが ZMK_SLEEP を強制しなくなったため、明示的に有効化している。
# 眠らせたくないときはこの2行をコメントアウトする。
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_PAW3222_REPORT_INTERVAL_MS=8

# Battery history events must relay from this peripheral to the central.
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# On-keyboard battery history persisted in Zephyr settings/flash.
# 40 samples at 30-minute intervals = about 20 hours of history.
CONFIG_SETTINGS=y
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_MAX_ENTRIES=40
CONFIG_ZMK_BATTERY_HISTORY_INTERVAL_MINUTES=30
CONFIG_ZMK_BATTERY_HISTORY_RECORD_SAME_LEVEL_INTERVAL_MINUTES=30
CONFIG_ZMK_BATTERY_HISTORY_SAVE_INTERVAL_MINUTES=30
CONFIG_ZMK_BATTERY_HISTORY_SAVE_LEVEL_THRESHOLD=2
CONFIG_ZMK_BATTERY_HISTORY_FORCE_SAVE_ON_SLEEP=y
CONFIG_ZMK_BATTERY_HISTORY_FORCE_SAVE_IF_EMPTY=y
