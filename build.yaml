---
# ZMK Studio は central（右手側）のみで有効にする。
# peripheral（左手側）は Studio を持たないので通常ビルドのまま。
include:
  - board: seeeduino_xiao_ble
    shield: pg1kb_proto_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: pg1kb_proto_right
  - board: seeeduino_xiao_ble
    shield: pg1kb_proto_left
    artifact-name: pg1kb_proto_left
